<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="viewer.css?v=2">
</head>
<body>
  <canvas id="gl" tabindex="0" aria-label="Gaussian scene viewport"></canvas>
  <div class="bar top">
    <button id="reset">Frame Scene</button>
    <button id="cameraView">Camera View</button>
    <button id="freeView">Free View</button>
    <span id="viewMode" class="accent">FREE VIEW</span><span class="sep"></span>
    <label><input id="showG" type="checkbox" checked>Gaussians</label>
  </div>
  <div class="internal-state" aria-hidden="true">
    <label><input id="showP" type="checkbox">Points</label>
    <label><input id="showGrid" type="checkbox" checked>Grid</label>
    <label><input id="showAxes" type="checkbox" checked>Axes</label>
    <label><input id="showC" type="checkbox" checked>Cameras</label>
    <label><input id="showPath" type="checkbox">Path</label>
  </div>
  <div id="navGizmo" aria-label="World orientation gizmo">
    <button data-view="Z+" class="z">Z</button>
    <button data-view="Y-" class="y negative">−Y</button>
    <button data-view="X-" class="x negative">−X</button>
    <button data-view="X+" class="x">X</button>
    <button data-view="Y+" class="y">Y</button>
    <button data-view="Z-" class="z negative">−Z</button>
  </div>
  <div class="bar stats"><span id="fps">0 FPS</span><span class="sep"></span><span id="count" class="accent">0 Gaussians</span><span class="sep"></span><span id="artifact">No artifact</span></div>
  <div class="bar bottom"><span id="unit">Z Up</span> · LMB orbit · RMB/MMB pan · wheel zoom · G/R/S transform · X/Y/Z constrain</div>
  <div id="error" class="bar error"></div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    (function () {
      var request = new XMLHttpRequest();
      request.open('GET', 'viewer.js?v=5');
      request.onload = function () {
        try {
          if (request.status !== 200 && request.status !== 0)
            throw new Error('viewer.js returned ' + request.status);
          (0, eval)(request.responseText + '\n//# sourceURL=gaussian-viewer.js');
        } catch (error) {
          report(error.message || String(error));
        }
      };
      request.onerror = function () { report('viewer.js is unavailable'); };
      function report(message) {
        var box = document.getElementById('error');
        box.textContent = 'Viewer load error: ' + message;
        box.style.display = 'block';
        document.title = 'error|' + message;
      }
      request.send();
    })();
  </script>
</body>
</html>
